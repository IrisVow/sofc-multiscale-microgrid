paths:
  data_root: outputs/pinndata
  merged_steady: doe_ext/merged/doe_steady_combined.parquet
  merged_transient: doe_cont/merged/doe_transient_combined2.parquet
  run_dir: outputs/pinn_sofc/experiments/interface_semantic_budget_20261015/runs/semantic_pilot_v3_resume
data:
  target_vars:
  - T
  - u
  - v
  - p
  - w1
  - w2
  - w3
  - phis
  - phil
  - htQ
  - qav_an
  - qav_ca
  waveform_input: true
  steady_train:
  - S1
  - S3
  - S5
  - S7
  - S8
  - E1
  - E2
  - E3
  - F1
  - F2
  - F3
  - F4
  - F5
  - F6
  - F7
  - F8
  - F9
  - F10
  - F11
  - F12
  steady_val:
  - S2
  - S4
  - S6
  steady_test:
  - S9
  transient_train:
  - T0
  - T1
  - T2
  - T4
  - T5
  - T6
  - T8
  - T9
  - R1
  - R2
  - R3
  - R4
  transient_test:
  - T3
  use_transient: true
  transient_frac: 0.6
  samples_per_epoch: 20000
  step_window_weight: 5.0
  steady_case_weights: {}
  domain_weights:
    air_channel: 1.0
    air_electrode: 1.2
    electrolyte: 2.0
    fuel_electrode: 1.2
    fuel_channel: 1.0
  batch_size: 2048
  num_workers: 0
  loss_rel:
    qav_an: 0.5
    qav_ca: 0.5
  lambda_rel: 0.25
  loss_rel_eps: 0.2
  loss_var_weights:
    T: 4.0
  t_scale_s: 1200.0
  initial_temperature_file: outputs/pinn_sofc/experiments/electrochem_corrected_20261015/initial_reference/temperature_from_training_steady.parquet
  supervised_time_strata:
  - 0
  - 200
  - 400
  - 800
  - 1200
  supervised_axial_strata:
  - 0
  - 0.025
  - 0.05
  - 0.075
  - 0.1
  loss_weight_space: normalized
model:
  fourier: true
  n_freq: 10
  f_min:
  - 1.0
  - 2.0
  - 1.0
  f_max:
  - 16.0
  - 128.0
  - 32.0
  fourier_cols:
  - 0
  - 1
  - 2
  hidden: 384
  layers: 8
  dropout: 0.05
pde:
  enabled: true
  collocation_per_domain:
    air_channel: 192
    air_electrode: 192
    electrolyte: 192
    fuel_electrode: 192
    fuel_channel: 192
  transient_collocation_per_domain:
    air_channel: 192
    air_electrode: 192
    electrolyte: 192
    fuel_electrode: 192
    fuel_channel: 192
  interface_per_iface: 192
  lambda_pde: 0.3
  lambda_pde_t: 0.25
  lambda_ic: 0.15
  lambda_pre: 0.05
  ic_hotspot_points: 0
  hotspot_weights:
    air_channel:
    - 0.06
    - 0.1
    - 0.0
    - 0.0008
    - 3.0
    air_electrode:
    - 0.06
    - 0.1
    - 0.0008
    - 0.0013
    - 2.0
    electrolyte:
    - 0.06
    - 0.1
    - 0.0013
    - 0.00132
    - 2.0
    fuel_electrode:
    - 0.06
    - 0.1
    - 0.00132
    - 0.00182
    - 2.0
    fuel_channel:
    - 0.06
    - 0.1
    - 0.00182
    - 0.00222
    - 2.0
  lambda_final: 0.0
  lambda_int: 0.02
  lambda_bc: 0.05
  ramp_start_epoch: 0
  ramp_end_epoch: 1
  use_bv: true
  balance: true
  eq_weights: {}
  boundary_per_edge: 192
  physical_case_scope: training_only
  time_strata:
  - 0
  - 200
  - 400
  - 800
  - 1200
  axial_strata:
  - 0
  - 0.025
  - 0.05
  - 0.075
  - 0.1
  gradient_balance:
    enabled: true
    physics_to_data_norm_ratio: 1.0
    budgets:
      steady_pde: 0.2
      transient_pde: 0.3
      interface: 0.15
      initial: 0.15
      pre_step: 0.05
      boundary: 0.15
  interface_gradient_allocation:
    mode: semantic_equal
    shares:
      temperature: 0.16666666666666666
      heat_flux: 0.16666666666666666
      ionic_potential: 0.16666666666666666
      ionic_flux: 0.16666666666666666
      electronic_insulation: 0.16666666666666666
      normal_mass_flux: 0.16666666666666666
train:
  lr: 0.001
  weight_decay: 1.0e-05
  epochs: 250
  warmup_epochs: 5
  grad_clip: 1.0
  seed: 42
  eval_every: 1
  device: cuda
  amp: false
  loss_weight_mode: fixed
  best_t_weight: 4.0
  lr_schedule: warmup_cosine
  physics_update_mode: joint_last_batch
  selection_metric: temperature_hotspot
  evaluate_tests_during_training: false
  checkpoint_every_epochs: 1
evaluate:
  metrics:
  - rmse
  - mae
  - rel_l2
  save_parity_plot: true
